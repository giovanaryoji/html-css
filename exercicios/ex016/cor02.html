<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        * { /*Configurações globais da CSS */
            height: 100%;
        }
        body {
            background-image: linear-gradient(to right, #920CF7 10%, #AB07F2, #CD06E9, #FC02D8, #F400C4, #FE0585, #FF0F44, #FC7E03 90%);
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>Testando Gradiente</h1>
</body>
</html>
