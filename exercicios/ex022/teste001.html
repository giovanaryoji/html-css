<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste001</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        h1 {
            padding: 30px;
            text-align: center;
        }

        main {
            min-width: 300px;
            max-width: 1000px;
            margin: auto;
            background-color: lightblue;
            padding: 20px;
        }

        .square {
            width: 300px;
            height: 100px;
            border: 2px solid black;
            border-radius: 20px;
            background-color: white;
            display: inline-block;
            margin-left: 20px;
        }

        #q1 {
            background-image: url(imagens/pattern001.png);
        }

        #q2 {
            background-image: url(imagens/pattern002.png);
        }

        #q3 {
            background-image: url(imagens/pattern003.png);
        }

        #q4 {
            background-image: url(imagens/pattern004.png);
        }

        #q5 {
            background-image: url(imagens/wallpaper001.jpg);
        }

        #q6 {
            background-image: url(imagens/wallpaper002.jpg);
        }
    </style>
</head>
<body>
    <main>
        <h1>Teste 001</h1>
        <div class="square" id="q1"></div>
        <div class="square" id="q2"></div>
        <div class="square" id="q3"></div>
        <div class="square" id="q4"></div>
        <div class="square" id="q5"></div>
        <div class="square" id="q6"></div>
    </main>
    
</body>
</html>
