<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralização vertical</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
        }

        #container {
            position: relative;

            height: 100vh;

            background-color: black;
            background-image: url(imagens/wallpaper001.jpg);
        }

        #conteudo {
            position: absolute;

            height: 200px;
            width: 200px;
            background-color: #F7EFAA;
            box-shadow: 3px 4px 10px rgba(0, 0, 0, 0.452);

            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        #conteudo > p {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo">
            <p>Era para ser um post it</p>
        </article>
    </section>
</body>
</html>
